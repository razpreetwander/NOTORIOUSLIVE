name: YouTube Auto Stream

on:
  workflow_dispatch:

jobs:
  live-stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video from GitHub Release
      run: |
        mkdir -p inputs
        # -L flag lagakar direct download link fetch karenge
        VIDEO_URL="https://github.com/razpreetwander/NOTORIOUSLIVE/releases/download/Video.mp4/video.mp4"
        
        echo "Downloading video from GitHub Release..."
        curl -L -o inputs/video.mp4 "$VIDEO_URL"
        
        # Check karein file ka size
        FILESIZE=$(stat -c%s "inputs/video.mp4")
        echo "Downloaded file size: $FILESIZE bytes"
        
        if [ "$FILESIZE" -lt 1000000 ]; then
          echo "Error: File bahut choti download hui hai, shayad link galat hai!"
          exit 1
        fi

    - name: Start Streaming to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      run: |
        ffmpeg -re -stream_loop -1 -i inputs/video.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY
