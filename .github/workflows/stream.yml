name: YouTube Auto Stream

on:
  workflow_dispatch:

jobs:
  live-stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video from Google Drive
      run: |
        mkdir -p inputs
        VIDEO_URL="https://drive.google.com/uc?export=download&id=18thJl3Gm6nGznETQEWq2sI5qT23qK3Hr"
        echo "Downloading video from Google Drive..."
        curl -L -o inputs/video.mp4 "$VIDEO_URL"

    - name: Start Streaming to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      run: |
        ffmpeg -re -stream_loop -1 -i inputs/video.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY

