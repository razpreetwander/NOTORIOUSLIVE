Name: YouTube Auto Stream

on:
  workflow_dispatch:

jobs:
  live-stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video from Private GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p inputs
        
        echo "Downloading new video using GitHub CLI..."
        # Yahan apne release ka tag (jaise 'video.mp4' ya jo bhi hai) aur file ka naam daal diya hai
        gh release download video.mp4 -R razpreetwander/NOTORIOUSLIVE -p "video.mp4" --dir inputs
        
        # Check size
        ls -lh inputs/video.mp4

    - name: Start Streaming to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      run: |
        ffmpeg -re -stream_loop -1 -i inputs/video.mp4 \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY
